<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-1C558CYB9J');
  // Count a lead only when this page follows a real form submission, exactly once.
  // Direct visits and reloads do not fire the event.
  try {
    var raw = sessionStorage.getItem('fa_lead_form');
    if (raw) {
      sessionStorage.removeItem('fa_lead_form');
      var lead = JSON.parse(raw);
      // Fire only within 2 minutes of the submit that set the flag, so a
      // failed submission or an old flag can never fire a false lead later.
      if (lead && lead.form && (Date.now() - lead.t) < 120000) {
        gtag('event', 'generate_lead', { form_name: lead.form });
      }
    }
  } catch (e) {}
</script>
